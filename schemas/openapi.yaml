openapi: 3.1.0
info:
  title: Contabilidade Brasil API
  version: 0.1.0
  description: Contrato inicial da plataforma contábil; regras fiscais e schema físico são adaptadores versionados.
servers:
  - url: http://localhost:8000
    description: Fundação local
  - url: https://api.example.com
    description: Exemplo
paths:
  /v1/journals:
    get:
      summary: Lista journals da empresa
      operationId: listJournals
      parameters:
        - in: query
          name: legal_entity_id
          required: true
          schema: { type: string }
        - in: query
          name: period_id
          schema: { type: string }
        - in: query
          name: status
          schema: { type: string }
        - in: query
          name: reverses_journal_id
          schema: { type: string }
        - in: query
          name: cursor
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        '200': { description: Página de journals }
    post:
      summary: Cria journal em draft
      operationId: createJournal
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/JournalEntry' }
      responses:
        '201': { description: Journal criado, content: { application/json: { schema: { $ref: '#/components/schemas/JournalEntry' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/journals/{journal_id}/publish:
    post:
      summary: Publica journal validado e aprovado
      operationId: publishJournal
      parameters:
        - in: path
          name: journal_id
          required: true
          schema: { type: string }
      responses:
        '200': { description: Journal publicado, content: { application/json: { schema: { $ref: '#/components/schemas/JournalEntry' } } } }
        '409': { description: 'Período fechado, desequilíbrio ou estado inválido' }
  /v1/documents:
    post:
      summary: Recebe um documento original e calcula o hash
      operationId: createDocument
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, document_type]
              properties:
                file: { type: string, format: binary }
                document_type: { type: string }
                legal_entity_id: { type: string }
                competence: { type: string }
                source_ref: { type: string }
      responses:
        '201': { description: Documento guardado, content: { application/json: { schema: { $ref: '#/components/schemas/SourceDocument' } } } }
        '200': { description: O mesmo conteúdo já existia neste escritório }
    get:
      summary: Lista documentos do escritório
      operationId: listDocuments
      parameters:
        - in: query
          name: legal_entity_id
          schema: { type: string }
        - in: query
          name: document_type
          schema: { type: string }
      responses:
        '200': { description: Documentos }
  /v1/documents/{document_id}:
    get:
      summary: Detalhe do documento original
      operationId: getDocument
      parameters:
        - $ref: '#/components/parameters/DocumentId'
      responses:
        '200': { description: Documento, content: { application/json: { schema: { $ref: '#/components/schemas/SourceDocument' } } } }
        '404': { description: Documento de outro escritório ou inexistente }
  /v1/documents/{document_id}/content:
    get:
      summary: Baixa o original depois da checagem de escritório
      operationId: downloadDocument
      parameters:
        - $ref: '#/components/parameters/DocumentId'
      responses:
        '200': { description: Conteúdo original }
        '404': { description: Documento de outro escritório ou inexistente }
  /v1/document-requests:
    post:
      summary: Abre um pedido de documento na competência
      operationId: createDocumentRequest
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [legal_entity_id, period_id, document_type, title, due_on]
              properties:
                legal_entity_id: { type: string }
                period_id: { type: string }
                document_type: { type: string }
                title: { type: string, maxLength: 200 }
                due_on: { type: string, format: date }
      responses:
        '201': { description: Pedido aberto, content: { application/json: { schema: { $ref: '#/components/schemas/DocumentRequest' } } } }
        '409': { description: Período fechado }
    get:
      summary: Lista pedidos da empresa na competência
      operationId: listDocumentRequests
      parameters:
        - in: query
          name: legal_entity_id
          required: true
          schema: { type: string }
        - in: query
          name: period_id
          required: true
          schema: { type: string }
      responses:
        '200': { description: Pedidos }
  /v1/document-requests/queue:
    get:
      summary: Fila de pedidos do escritório ativo
      description: O padrão lista open e received, que bloqueiam o fechamento. A ordem é o prazo e, no mesmo prazo, open antes de received. O cliente da empresa não usa esta fila.
      operationId: listDocumentRequestQueue
      parameters:
        - in: query
          name: status
          schema: { type: string }
        - in: query
          name: due_before
          schema: { type: string, format: date }
        - in: query
          name: year
          schema: { type: integer }
        - in: query
          name: month
          schema: { type: integer }
        - in: query
          name: cursor
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        '200': { description: Fila do escritório }
        '403': { description: Acesso de cliente ou de outro escritório }
  /v1/portal/document-requests:
    get:
      summary: Pedidos da empresa do cliente
      description: Sem filtro, devolve open e received. O histórico pede confirmed,cancelled. A resposta inclui o resumo da empresa, o mês de referência, o nome do arquivo e as datas de recebimento e confirmação.
      operationId: listPortalDocumentRequests
      parameters:
        - in: query
          name: status
          schema: { type: string }
        - in: query
          name: cursor
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        '200': { description: Pedidos do cliente e o resumo }
        '400': { description: Estado ou cursor inválido }
        '403': { description: Quem não é cliente da empresa }
  /v1/portal/document-requests/{request_id}:
    get:
      summary: Detalhe do pedido do cliente, com arquivos e conversa
      operationId: getPortalDocumentRequest
      parameters:
        - in: path
          name: request_id
          required: true
          schema: { type: string }
      responses:
        '200': { description: Pedido, arquivos e comentários }
        '404': { description: Pedido de outra empresa ou inexistente }
  /v1/portal/document-requests/{request_id}/comments:
    post:
      summary: O cliente comenta no próprio pedido aberto ou recebido
      operationId: commentPortalDocumentRequest
      parameters:
        - in: path
          name: request_id
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [body]
              properties:
                body: { type: string, minLength: 1, maxLength: 1000 }
      responses:
        '201': { description: Comentário registrado, sem o texto na auditoria }
        '409': { description: Pedido já encerrado }
  /v1/portal/document-requests/{request_id}/content:
    post:
      summary: O cliente envia o arquivo do próprio pedido
      operationId: receivePortalDocumentRequest
      parameters:
        - in: path
          name: request_id
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '200': { description: Arquivo ligado ao pedido }
        '404': { description: Pedido de outra empresa ou inexistente }
  /v1/portal/documents/{document_id}/content:
    get:
      summary: Baixa o arquivo ligado a um pedido do cliente
      operationId: downloadPortalDocument
      parameters:
        - in: path
          name: document_id
          required: true
          schema: { type: string }
      responses:
        '200': { description: Conteúdo original }
        '404': { description: Arquivo de outro pedido ou inexistente }
  /v1/portal/preferences:
    get:
      summary: Preferência de aviso do cliente
      operationId: getPortalPreferences
      responses:
        '200': { description: notify_client }
    patch:
      summary: Liga ou desliga o aviso por e-mail
      operationId: updatePortalPreferences
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [notify_client]
              properties:
                notify_client: { type: boolean }
      responses:
        '200': { description: Preferência gravada na membership }
  /v1/portal/submissions:
    get:
      summary: Documentos que o cliente enviou sem pedido
      operationId: listPortalSubmissions
      responses:
        '200': { description: Envios da empresa do cliente }
    post:
      summary: O cliente envia um documento sem pedido
      operationId: createPortalSubmission
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
                note: { type: string, maxLength: 500 }
      responses:
        '201': { description: Envio registrado. Não bloqueia o fechamento. }
  /v1/client-submissions:
    get:
      summary: Envios sem pedido do escritório
      operationId: listClientSubmissions
      parameters:
        - in: query
          name: status
          schema: { type: string, default: new }
      responses:
        '200': { description: Envios }
        '403': { description: Acesso de cliente }
  /v1/client-submissions/{submission_id}/classify:
    post:
      summary: Classifica o envio como pedido já recebido
      operationId: classifyClientSubmission
      parameters:
        - in: path
          name: submission_id
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [period_id, document_type, title, due_on]
              properties:
                period_id: { type: string }
                document_type: { type: string }
                title: { type: string, maxLength: 200 }
                due_on: { type: string, format: date }
      responses:
        '200': { description: Pedido recebido criado }
        '409': { description: Envio já tratado ou período fechado }
  /v1/client-submissions/{submission_id}/discard:
    post:
      summary: Descarta o envio e preserva o arquivo
      operationId: discardClientSubmission
      parameters:
        - in: path
          name: submission_id
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason: { type: string, minLength: 10, maxLength: 2000 }
      responses:
        '200': { description: Envio descartado }
        '400': { description: Motivo curto }
  /v1/legal-entities/{legal_entity_id}/exports:
    post:
      summary: Pede a exportação operacional da competência
      description: preparer, approver ou admin dispara. A lista de operações não é uma tela. O resultado sai em GET /v1/exports/{export_id}.
      operationId: createOperationalExport
      parameters:
        - in: path
          name: legal_entity_id
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [period_id, kind]
              properties:
                period_id: { type: string }
                kind: { type: string, enum: [operational_v1] }
      responses:
        '202': { description: "Exportação aceita, com export_id, operation_id e correlation_id" }
        '403': { description: Papel insuficiente }
  /v1/exports/{export_id}:
    get:
      summary: Pacote operacional quando a operação terminou
      operationId: getOperationalExport
      parameters:
        - in: path
          name: export_id
          required: true
          schema: { type: string }
      responses:
        '200': { description: Pacote JSON, content: { application/json: { schema: { $ref: '#/components/schemas/OperationalExport' } } } }
        '404': { description: Exportação de outro escritório ou inexistente }
        '409': { description: "Ainda em fila, gerando ou falhou" }
  /v1/document-requests/{request_id}/content:
    post:
      summary: Grava o arquivo original e marca o pedido como recebido
      operationId: receiveDocumentRequest
      parameters:
        - in: path
          name: request_id
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '200': { description: Arquivo ligado ao pedido, content: { application/json: { schema: { $ref: '#/components/schemas/DocumentRequest' } } } }
        '409': { description: Estado ou período não aceita o arquivo, ou o pedido já tem 10 arquivos ativos }
  /v1/document-requests/{request_id}:
    get:
      summary: Detalhe do pedido, com arquivos e conversa
      operationId: getDocumentRequest
      parameters:
        - in: path
          name: request_id
          required: true
          schema: { type: string }
      responses:
        '200': { description: Pedido do escritório }
        '403': { description: Acesso de cliente }
        '404': { description: Pedido inexistente neste escritório }
  /v1/document-requests/{request_id}/return:
    post:
      summary: Devolve o pedido recebido ao cliente
      operationId: returnDocumentRequest
      parameters:
        - in: path
          name: request_id
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason: { type: string, minLength: 10, maxLength: 2000 }
      responses:
        '200': { description: Pedido voltou a aberto e os arquivos ativos ficaram devolvidos }
        '400': { description: Motivo curto }
        '409': { description: O pedido não está recebido }
  /v1/document-requests/{request_id}/comments:
    get:
      summary: Conversa do pedido
      operationId: listDocumentRequestComments
      parameters:
        - in: path
          name: request_id
          required: true
          schema: { type: string }
      responses:
        '200': { description: Comentários em ordem }
    post:
      summary: O escritório comenta no pedido aberto ou recebido
      operationId: commentDocumentRequest
      parameters:
        - in: path
          name: request_id
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [body]
              properties:
                body: { type: string, minLength: 1, maxLength: 1000 }
      responses:
        '201': { description: Comentário registrado. A auditoria guarda só o identificador. }
  /v1/document-requests/{request_id}/confirm:
    post:
      summary: Confirma o pedido depois que há um arquivo ativo
      operationId: confirmDocumentRequest
      parameters:
        - in: path
          name: request_id
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200': { description: Pedido confirmado, content: { application/json: { schema: { $ref: '#/components/schemas/DocumentRequest' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: Arquivo ausente ou estado inválido }
  /v1/document-requests/{request_id}/cancel:
    post:
      summary: Cancela o pedido com motivo
      operationId: cancelDocumentRequest
      parameters:
        - in: path
          name: request_id
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 10, maxLength: 2000 }
      responses:
        '200': { description: Pedido cancelado, content: { application/json: { schema: { $ref: '#/components/schemas/DocumentRequest' } } } }
        '400': { description: Motivo curto }
  /v1/import-batches:
    post:
      summary: Inicia lote de importação em dry-run
      operationId: createImportBatch
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [legal_entity_id, source_system, mode, files]
              properties:
                legal_entity_id: { type: string }
                source_system: { type: string }
                mode: { type: string, enum: [dry_run, publish, rollback] }
                period_id: { type: [string, 'null'] }
                files:
                  type: array
                  items:
                    type: object
                    required: [document_id, kind]
                    properties:
                      document_id: { type: string }
                      kind: { type: string }
      responses:
        '202': { description: Job aceito, content: { application/json: { schema: { $ref: '#/components/schemas/OperationAccepted' } } } }
        '409': { description: Publicação direta ou rollback não aceitos nesta fase }
    get:
      summary: Lista lotes da empresa
      operationId: listImportBatches
      parameters:
        - in: query
          name: legal_entity_id
          required: true
          schema: { type: string }
      responses:
        '200': { description: Lotes }
  /v1/import-batches/templates/{kind}:
    get:
      summary: Cabeçalho CSV do tipo de arquivo
      operationId: getImportTemplate
      parameters:
        - in: path
          name: kind
          required: true
          schema: { type: string }
      responses:
        '200': { description: Cabeçalho CSV }
        '404': { description: Tipo sem modelo }
  /v1/import-batches/{batch_id}:
    get:
      summary: Detalhe do lote, resumo e erros
      operationId: getImportBatch
      parameters:
        - $ref: '#/components/parameters/BatchId'
      responses:
        '200': { description: Lote, content: { application/json: { schema: { $ref: '#/components/schemas/ImportBatch' } } } }
  /v1/import-batches/{batch_id}/rows:
    get:
      summary: Linhas do lote
      operationId: listImportRows
      parameters:
        - $ref: '#/components/parameters/BatchId'
        - in: query
          name: status
          schema: { type: string }
      responses:
        '200': { description: Linhas }
  /v1/import-batches/{batch_id}/report:
    get:
      summary: Relatório de diferença entre arquivo e razão do lote
      operationId: getImportReport
      parameters:
        - $ref: '#/components/parameters/BatchId'
      responses:
        '200': { description: Diferenças por conta }
        '404': { description: Relatório ainda não gerado }
  /v1/import-batches/{batch_id}/publish:
    post:
      summary: Pede a publicação aprovada do lote pronto
      operationId: publishImportBatch
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/BatchId'
      responses:
        '202': { description: Publicação aceita, content: { application/json: { schema: { $ref: '#/components/schemas/OperationAccepted' } } } }
        '403': { description: O criador do lote não pode publicá-lo }
        '409': { description: O lote ainda não está pronto }
  /v1/bank-accounts:
    post:
      summary: Cadastra uma conta banco ligada a uma conta do razão
      operationId: createBankAccount
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [legal_entity_id, account_id, name, bank_code, branch, account_number_masked]
              properties:
                legal_entity_id: { type: string }
                account_id: { type: string }
                name: { type: string }
                bank_code: { type: string }
                branch: { type: string }
                account_number_masked: { type: string, pattern: '^[0-9]{4}$' }
      responses:
        '201': { description: Conta banco criada }
        '409': { description: A conta do razão já está ligada }
    get:
      summary: Lista contas banco da empresa
      operationId: listBankAccounts
      parameters:
        - in: query
          name: legal_entity_id
          required: true
          schema: { type: string }
      responses:
        '200': { description: Lista de contas banco }
  /v1/bank-accounts/{bank_account_id}/summary:
    get:
      summary: Resume saldo e pendências da conta banco no período
      operationId: getBankAccountSummary
      parameters:
        - $ref: '#/components/parameters/BankAccountId'
        - in: query
          name: period_id
          required: true
          schema: { type: string }
      responses:
        '200': { description: Resumo da conta banco }
        '404': { description: Conta ou período não encontrado }
  /v1/bank-accounts/{bank_account_id}/statements:
    post:
      summary: Recebe um extrato já armazenado e pede a leitura
      operationId: createBankStatement
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/BankAccountId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [document_id]
              properties:
                document_id: { type: string }
      responses:
        '202': { description: Leitura aceita, content: { application/json: { schema: { $ref: '#/components/schemas/StatementAccepted' } } } }
    get:
      summary: Lista extratos da conta banco
      operationId: listBankStatements
      parameters:
        - $ref: '#/components/parameters/BankAccountId'
      responses:
        '200': { description: Lista de extratos }
  /v1/bank-statements/{statement_id}:
    get:
      summary: Consulta o estado da leitura do extrato
      operationId: getBankStatement
      parameters:
        - $ref: '#/components/parameters/StatementId'
      responses:
        '200': { description: Extrato }
        '404': { description: Extrato não encontrado }
  /v1/reconciliation-cases:
    get:
      summary: Lista casos de conciliação da conta banco
      operationId: listReconciliationCases
      parameters:
        - in: query
          name: bank_account_id
          required: true
          schema: { type: string }
        - in: query
          name: status
          schema: { type: string }
        - in: query
          name: cursor
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100 }
      responses:
        '200': { description: Casos de conciliação }
  /v1/reconciliation-cases/{case_id}:
    get:
      summary: Consulta um caso de conciliação
      operationId: getReconciliationCase
      parameters:
        - $ref: '#/components/parameters/CaseId'
      responses:
        '200': { description: Caso, content: { application/json: { schema: { $ref: '#/components/schemas/ReconciliationCase' } } } }
        '404': { description: Caso não encontrado }
  /v1/reconciliation-cases/{case_id}/approve:
    post:
      summary: Aprova uma sugestão de conciliação
      operationId: approveReconciliation
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CaseId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [candidate_id]
              properties:
                candidate_id: { type: string }
      responses:
        '200': { description: Caso aprovado, content: { application/json: { schema: { $ref: '#/components/schemas/ReconciliationCase' } } } }
        '403': { description: Papel insuficiente }
        '409': { description: Linha já conciliada ou estado inválido }
  /v1/reconciliation-cases/{case_id}/reject:
    post:
      summary: Rejeita a sugestão sem apagar a transação
      operationId: rejectReconciliation
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CaseId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Reason' }
      responses:
        '200': { description: Caso rejeitado, content: { application/json: { schema: { $ref: '#/components/schemas/ReconciliationCase' } } } }
  /v1/reconciliation-cases/{case_id}/ignore:
    post:
      summary: Ignora o caso sem apagar a transação
      operationId: ignoreReconciliation
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CaseId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Reason' }
      responses:
        '200': { description: Caso ignorado, content: { application/json: { schema: { $ref: '#/components/schemas/ReconciliationCase' } } } }
  /v1/reconciliation-cases/{case_id}/reverse:
    post:
      summary: Desfaz o vínculo sem apagar a transação
      operationId: reverseReconciliation
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CaseId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Reason' }
      responses:
        '200': { description: Caso revertido, content: { application/json: { schema: { $ref: '#/components/schemas/ReconciliationCase' } } } }
  /v1/reconciliation-cases/{case_id}/resuggest:
    post:
      summary: Recalcula os candidatos do caso
      operationId: resuggestReconciliation
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CaseId'
      responses:
        '200': { description: Caso com nova sugestão, content: { application/json: { schema: { $ref: '#/components/schemas/ReconciliationCase' } } } }
  /v1/reconciliation-cases/{case_id}/journal:
    post:
      summary: Cria um lançamento rascunho a partir do caso
      operationId: createJournalFromReconciliation
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CaseId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [counterpart_account_id]
              properties:
                counterpart_account_id: { type: string }
                description: { type: string }
                cost_center_id: { type: string }
      responses:
        '201': { description: Rascunho criado, content: { application/json: { schema: { $ref: '#/components/schemas/JournalEntry' } } } }
  /v1/periods/{period_id}/close-runs:
    post:
      summary: Abre ou devolve a execução de fechamento aberta da competência
      operationId: openCloseRun
      parameters:
        - $ref: '#/components/parameters/PeriodId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201': { description: Execução aberta }
        '200': { description: Execução aberta já existente }
        '409': { description: Período fechado }
  /v1/close-runs/{close_run_id}:
    get:
      summary: Checklist calculado da execução de fechamento
      operationId: getCloseRun
      parameters:
        - in: path
          name: close_run_id
          required: true
          schema: { type: string }
      responses:
        '200': { description: Execução e checklist, content: { application/json: { schema: { $ref: '#/components/schemas/CloseRun' } } } }
        '404': { description: Execução não encontrada }
  /v1/close-runs/{close_run_id}/items/{item_id}:
    post:
      summary: Conclui a revisão do balancete ou marca um item como não aplicável
      operationId: decideCloseItem
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - in: path
          name: close_run_id
          required: true
          schema: { type: string }
        - in: path
          name: item_id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [status]
              properties:
                status: { type: string, enum: [completed, not_applicable] }
                reason: { type: string, maxLength: 2000 }
      responses:
        '200': { description: Checklist atualizado }
        '400': { description: Decisão inválida }
        '403': { description: Papel insuficiente }
        '409': { description: Execução não está aberta }
  /v1/close-runs/{close_run_id}/close:
    post:
      summary: Fecha a competência quando não há bloqueio pendente e grava o snapshot
      operationId: closeCloseRun
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - in: path
          name: close_run_id
          required: true
          schema: { type: string }
      responses:
        '200': { description: Competência fechada e snapshot gravado }
        '409': { description: Itens bloqueantes pendentes }
  /v1/close-runs/{close_run_id}/evidence-package:
    get:
      summary: Gera o pacote de evidências a partir do snapshot imutável
      operationId: downloadEvidencePackage
      parameters:
        - in: path
          name: close_run_id
          required: true
          schema: { type: string }
      responses:
        '200': { description: Pacote JSON com manifesto e snapshot }
        '409': { description: Execução ainda não fechada }
  /v1/obligations/{obligation_id}:
    get:
      summary: Consulta o status de uma obrigação
      operationId: getObligation
      parameters:
        - in: path
          name: obligation_id
          required: true
          schema: { type: string }
      responses:
        '200': { description: Obrigação, content: { application/json: { schema: { $ref: '#/components/schemas/RegulatoryObligation' } } } }
  /v1/operations:
    get:
      summary: Lista operações assíncronas do escritório
      description: Filtro por kind, status e correlation_id. Não há tela para esta lista. O cliente da empresa não consulta.
      operationId: listOperations
      parameters:
        - in: query
          name: kind
          schema: { type: string }
        - in: query
          name: status
          schema: { type: string, enum: [accepted, running, completed, failed] }
        - in: query
          name: correlation_id
          schema: { type: string }
        - in: query
          name: cursor
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        '200': { description: "Operações, com operation_id, status, correlation_id, kind e target_ref" }
        '403': { description: Acesso de cliente }
  /v1/operations/{operation_id}:
    get:
      summary: Consulta status, correlation_id e código de erro de um job assíncrono
      operationId: getOperation
      parameters:
        - in: path
          name: operation_id
          required: true
          schema: { type: string }
      responses:
        '200': { description: Status da operação, content: { application/json: { schema: { $ref: '#/components/schemas/OperationAccepted' } } } }
  /v1/users:
    get:
      summary: Pessoas do escritório autenticado
      operationId: listUsers
      responses:
        '200': { description: Usuários e papéis }
        '403': { description: Papel insuficiente }
    post:
      summary: Convida uma pessoa para o escritório
      operationId: inviteUser
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [username, display_name, email, roles]
              properties:
                username:
                  type: string
                  minLength: 1
                  maxLength: 64
                  description: Gravado em minúsculas, como o Cognito devolve no token.
                display_name: { type: string, minLength: 1, maxLength: 200 }
                email: { type: string, minLength: 3, maxLength: 200 }
                roles:
                  type: array
                  minItems: 1
                  maxItems: 4
                  items: { type: string, enum: [preparer, approver, admin, viewer, client] }
                legal_entity_id: { type: string, description: Obrigatório quando o papel é client. }
      responses:
        '201': { description: "Convite registrado. Para um cliente que já existe ligado à mesma empresa, só cria o login, sem duplicar o acesso." }
        '400': { description: Dados do convite inválidos }
        '403': { description: Papel insuficiente }
        '409': { description: Usuário já existe neste ou noutro escritório com outro acesso }
        '503': { description: Diretório de usuários não configurado }
  /v1/me:
    get:
      summary: Identidade, papéis e escritórios da pessoa
      description: O escritório ativo é o do token. O header X-Tenant-Id só troca o escritório quando a pessoa é administradora no escritório do login e já tem membership no escritório pedido. O login de cliente ignora o header e devolve só a própria empresa. Os demais logins recebem apenas o escritório do token.
      operationId: getMe
      responses:
        '200': { description: Sessão }
        '401': { description: Token ausente ou inválido }
  /v1/legal-entities:
    get:
      summary: Empresas do escritório autenticado
      operationId: listLegalEntities
      responses:
        '200': { description: Empresas }
    post:
      summary: Cadastra empresa com matriz, modelo mínimo e períodos do ano
      operationId: createLegalEntity
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, cnpj, fiscal_year]
              properties:
                name: { type: string, minLength: 1, maxLength: 200 }
                cnpj: { type: string, minLength: 1, maxLength: 32 }
                fiscal_year: { type: integer, minimum: 2000, maximum: 2100 }
      responses:
        '201': { description: Empresa criada }
        '400': { description: CNPJ inválido }
        '403': { description: Papel insuficiente }
        '409': { description: CNPJ já cadastrado neste escritório }
  /v1/legal-entities/{legal_entity_id}/accounts:
    get:
      summary: Plano de contas da empresa
      operationId: listAccounts
      parameters:
        - $ref: '#/components/parameters/LegalEntityId'
      responses:
        '200': { description: Contas }
    post:
      summary: Cria conta
      operationId: createAccount
      parameters:
        - $ref: '#/components/parameters/LegalEntityId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201': { description: Conta criada }
        '409': { description: Código já existe }
  /v1/legal-entities/{legal_entity_id}/periods:
    get:
      summary: Períodos da empresa
      operationId: listPeriods
      parameters:
        - $ref: '#/components/parameters/LegalEntityId'
      responses:
        '200': { description: Períodos }
  /v1/periods/{period_id}/close:
    post:
      summary: Fecha período aberto ou reaberto
      operationId: closePeriod
      parameters:
        - $ref: '#/components/parameters/PeriodId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200': { description: Período fechado }
        '409': { description: Estado inválido }
  /v1/periods/{period_id}/reopen-requests:
    post:
      summary: Solicita reabertura com motivo
      operationId: requestReopen
      parameters:
        - $ref: '#/components/parameters/PeriodId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201': { description: Pedido criado }
  /v1/reopen-requests/{request_id}/approve:
    post:
      summary: Aprova reabertura por outro usuário
      operationId: approveReopen
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200': { description: Período reaberto }
        '403': { description: Segregação ou papel insuficiente }
  /v1/journals/{journal_id}:
    get:
      summary: Consulta journal e linhas
      operationId: getJournal
      parameters:
        - in: path
          name: journal_id
          required: true
          schema: { type: string }
      responses:
        '200': { description: Journal, content: { application/json: { schema: { $ref: '#/components/schemas/JournalEntry' } } } }
        '404': { description: Não encontrado neste escritório }
  /v1/journals/{journal_id}/submit:
    post:
      summary: Envia rascunho para aprovação
      operationId: submitJournal
      parameters:
        - $ref: '#/components/parameters/JournalId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200': { description: Journal pendente }
  /v1/journals/{journal_id}/approve:
    post:
      summary: Aprova journal pendente
      operationId: approveJournal
      parameters:
        - $ref: '#/components/parameters/JournalId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200': { description: Journal aprovado }
        '403': { description: Segregação de funções ou papel insuficiente }
  /v1/journals/{journal_id}/reject:
    post:
      summary: Rejeita journal pendente
      operationId: rejectJournal
      parameters:
        - $ref: '#/components/parameters/JournalId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200': { description: Journal rejeitado }
  /v1/journals/{journal_id}/reverse:
    post:
      summary: Cria rascunho de reversão
      operationId: reverseJournal
      parameters:
        - $ref: '#/components/parameters/JournalId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201': { description: Reversão em rascunho, content: { application/json: { schema: { $ref: '#/components/schemas/JournalEntry' } } } }
  /v1/legal-entities/{legal_entity_id}/trial-balance:
    get:
      summary: Balancete do período
      operationId: getTrialBalance
      parameters:
        - $ref: '#/components/parameters/LegalEntityId'
        - in: query
          name: period_id
          required: true
          schema: { type: string }
      responses:
        '200': { description: Saldos por conta postável }
  /v1/accounts/{account_id}/lines:
    get:
      summary: Drill-down das linhas publicadas da conta
      operationId: getAccountLines
      parameters:
        - in: path
          name: account_id
          required: true
          schema: { type: string }
        - in: query
          name: period_id
          required: true
          schema: { type: string }
      responses:
        '200': { description: Linhas até o journal de origem }
  /v1/audit-events:
    get:
      summary: Trilha de auditoria do escritório
      operationId: listAuditEvents
      responses:
        '200': { description: Eventos }
  /v1/audit-events/verify:
    get:
      summary: Verifica a cadeia de hashes da auditoria
      operationId: verifyAuditEvents
      responses:
        '200': { description: Resultado da verificação }
components:
  parameters:
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      schema: { type: string, minLength: 8, maxLength: 200 }
    LegalEntityId:
      in: path
      name: legal_entity_id
      required: true
      schema: { type: string }
    JournalId:
      in: path
      name: journal_id
      required: true
      schema: { type: string }
    PeriodId:
      in: path
      name: period_id
      required: true
      schema: { type: string }
    RequestId:
      in: path
      name: request_id
      required: true
      schema: { type: string }
    DocumentId:
      in: path
      name: document_id
      required: true
      schema: { type: string }
    BatchId:
      in: path
      name: batch_id
      required: true
      schema: { type: string }
    BankAccountId:
      in: path
      name: bank_account_id
      required: true
      schema: { type: string }
    StatementId:
      in: path
      name: statement_id
      required: true
      schema: { type: string }
    CaseId:
      in: path
      name: case_id
      required: true
      schema: { type: string }
  responses:
    BadRequest: { description: Payload inválido }
    Forbidden: { description: Ação não permitida }
  schemas:
    JournalEntry: { type: object, description: Validado por schemas/journal-entry.schema.json, additionalProperties: true }
    ImportBatch: { type: object, description: Validado por schemas/import-batch.schema.json, additionalProperties: true }
    SourceDocument: { type: object, description: Validado por schemas/source-document.schema.json, additionalProperties: true }
    DocumentRequest: { type: object, description: Validado por schemas/document-request.schema.json, additionalProperties: true }
    OperationalExport: { type: object, description: Validado por schemas/export-package.schema.json, additionalProperties: true }
    ReconciliationCase: { type: object, description: Validado por schemas/reconciliation-case.schema.json, additionalProperties: true }
    CloseRun: { type: object, description: Validado por schemas/close-run.schema.json, additionalProperties: true }
    RegulatoryObligation: { type: object, description: Validado por schemas/regulatory-obligation.schema.json, additionalProperties: true }
    Reason:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: { type: string, minLength: 3, maxLength: 2000 }
    StatementAccepted:
      type: object
      additionalProperties: false
      required: [operation_id, status, statement_id]
      properties:
        operation_id: { type: string }
        status: { type: string, enum: [accepted, running, completed, failed, cancelled] }
        correlation_id: { type: string }
        statement_id: { type: string }
    OperationAccepted:
      type: object
      additionalProperties: false
      required: [operation_id, status]
      properties:
        operation_id: { type: string }
        status: { type: string, enum: [accepted, running, completed, failed, cancelled] }
        correlation_id: { type: string }
        error_code: { type: [string, 'null'] }
