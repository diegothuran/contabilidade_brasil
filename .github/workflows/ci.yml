name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-static:
    name: API, contratos e documentação
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml

      - name: Instalar a API com as dependências de desenvolvimento
        run: pip install -e "apps/api[dev]"

      - name: Testes unitários
        working-directory: apps/api
        run: pytest tests/unit -q

      - name: Pyflakes
        working-directory: apps/api
        run: python -m pyflakes src

      - name: Validar specs
        run: python scripts/validate_specs.py

      - name: Links internos
        run: python scripts/check_internal_links.py

      - name: OpenAPI
        run: openapi-spec-validator schemas/openapi.yaml

      - name: Testes de contrato
        run: python -m pytest tests/contract -q

  web:
    name: Interface
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Não há package-lock.json no repositório, então npm ci não serve.
      - name: Instalar dependências
        run: npm install

      - name: Lint e tipos
        run: npm run lint

      - name: Build
        run: npm run build

  integration:
    name: Integração no compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Preparar o .env de exemplo
        run: cp .env.example .env

      - name: Subir a API e as dependências
        run: docker compose up -d --build --wait api

      - name: Testes dentro do container
        shell: bash
        run: |
          set -o pipefail
          docker compose exec -T api pytest -q -p no:warnings -rs | tee pytest.log
          # Um teste pulado aqui quer dizer que a integração não rodou de verdade.
          if grep -Eq '^SKIPPED|[0-9]+ skipped' pytest.log; then
            echo "::error::pytest pulou testes; confira RUN_INTEGRATION e DATABASE_ADMIN_URL no compose."
            exit 1
          fi

      - name: Logs do compose
        if: failure()
        run: docker compose logs --no-color api worker
