services:
  postgres:
    build:
      context: .
      dockerfile: deploy/postgres/Dockerfile
    image: contabil-postgres:local
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: contabil
      CONTABIL_APP_PASSWORD: ${CONTABIL_APP_PASSWORD}
      TZ: UTC
    command: ["postgres", "-c", "timezone=UTC"]
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d contabil"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: contabil-api:local
    environment: &app_env
      DATABASE_URL: postgresql+psycopg://contabil_app:${CONTABIL_APP_PASSWORD}@postgres:5432/contabil
      DATABASE_ADMIN_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD}@postgres:5432/contabil
      OIDC_ISSUER: http://localhost:${KEYCLOAK_PORT:-8080}/realms/contabil
      OIDC_AUDIENCE: contabil-api
      OIDC_JWKS_URL: http://keycloak:8080/realms/contabil/protocol/openid-connect/certs
      OIDC_TOKEN_URL: http://keycloak:8080/realms/contabil/protocol/openid-connect/token
      CORS_ORIGINS: http://localhost:5173
      SCHEMAS_DIR: /schemas
      DEV_USER_PASSWORD: ${DEV_USER_PASSWORD}
      APP_HOME: /app
      RUN_INTEGRATION: "1"
      OBJECT_STORAGE_ENDPOINT: http://minio:9000
      OBJECT_STORAGE_BUCKET: contabil-dev
      OBJECT_STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER}
      OBJECT_STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MAX_UPLOAD_BYTES: "52428800"
      SEED_DEMO: "1"
      OBJECT_STORAGE_CREATE_BUCKETS: "1"
    command: ["python", "-m", "contabil.migrate"]
    depends_on:
      postgres:
        condition: service_healthy
      minio-ready:
        condition: service_completed_successfully
    restart: "no"

  keycloak:
    build:
      context: .
      dockerfile: deploy/keycloak/Dockerfile
    image: contabil-keycloak:local
    command: ["start-dev", "--import-realm", "--http-port=8080"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME: http://localhost:${KEYCLOAK_PORT:-8080}
      KC_HEALTH_ENABLED: "true"
    ports:
      - "${KEYCLOAK_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/8080'"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 40s

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: contabil-api:local
    environment:
      <<: *app_env
    command: ["uvicorn", "contabil.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    init: true

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: contabil-api:local
    environment:
      <<: *app_env
    command: ["python", "-m", "contabil.worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    init: true

  web:
    build:
      context: apps/web
      args:
        VITE_OIDC_AUTHORITY: http://localhost:${KEYCLOAK_PORT:-8080}/realms/contabil
        VITE_OIDC_CLIENT_ID: contabil-web
        VITE_API_URL: http://localhost:8000
    image: contabil-web:local
    environment:
      PORT: "5173"
    ports:
      - "5173:5173"
    depends_on:
      api:
        condition: service_healthy

  minio:
    image: cgr.dev/chainguard/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  minio-ready:
    image: curlimages/curl:8.11.1
    depends_on:
      minio:
        condition: service_started
    restart: "no"
    command: ["curl", "-fsS", "--retry", "30", "--retry-delay", "2", "--retry-all-errors", "http://minio:9000/minio/health/live"]

  adminer:
    image: adminer:4
    profiles: ["tools"]
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  minio_data:
