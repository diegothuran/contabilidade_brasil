[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "contabil"
version = "0.1.0"
description = "Fundação local da Fase A da plataforma contábil brasileira."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.14,<2",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.6,<3",
  "PyJWT[crypto]>=2.10,<3",
  "httpx>=0.27,<1",
  "boto3>=1.35,<2",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "jsonschema>=4.20,<5",
  "openapi-spec-validator>=0.7,<1",
  "pyyaml>=6,<7",
  "pyflakes>=3,<4",
  "httpx2>=2.16,<3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
